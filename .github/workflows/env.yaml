name: Common Environment Variables

on:
  workflow_call:
    outputs:
      registry_url:
        value: ${{ jobs.env.outputs.registry_url }}
      image_name:
        value: ${{ jobs.env.outputs.image_name }}

jobs:
  env:
    runs-on: bolte-runner
    outputs:
      registry_url: localhost:5000
      image_name: buildenv-esp
    steps:
      - run: echo "Setting up common environment variables"
